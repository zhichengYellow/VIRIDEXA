name: viridexa

services:
  db:
    # Reuses the locally installed MySQL 8.0.44 image used by the legacy server.
    image: mysql:8.0
    container_name: viridexa-mysql-phase1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/dev-env.sh first}
      MYSQL_DATABASE: nonfood_oil_plants
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:?Run scripts/dev-env.sh first}
    command: ["mysqld", "--innodb-buffer-pool-size=128M"]
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=1g,mode=1777
    volumes:
      - ${LEGACY_SNAPSHOT_PATH:-/tmp/viridexa-phase1-live-snapshot.sql.gz}:/docker-entrypoint-initdb.d/90-legacy-snapshot.sql.gz:ro
      - ./infra/mysql/init/99-readonly-user.sh:/docker-entrypoint-initdb.d/99-readonly-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/nonfood_oil_plants?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: viridexa_ro
      DB_PASSWORD: ${MYSQL_READONLY_PASSWORD:?Run scripts/dev-env.sh first}
      WEB_ORIGIN: http://localhost:5173
      FLYWAY_ENABLED: "false"
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && read -r response <&3 && [[ \"$$response\" == *\" 200 \"* ]]'"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 35s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5173:80"
