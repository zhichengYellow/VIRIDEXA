set_real_ip_from 172.31.0.2/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
# http-context include for the isolated tunnel network. Keep only when tunnel
# traffic is the sole path to Nginx and the connector address is pinned.
geo $realip_remote_addr $trusted_tunnel_peer {
    default 0;
    172.31.0.2/32 1;
}
map "$trusted_tunnel_peer:$http_x_forwarded_proto" $viridexa_forwarded_scheme {
    default $scheme;
    "1:https" https;
}
