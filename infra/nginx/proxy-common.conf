proxy_pass http://api:8080;
proxy_http_version 1.1;
# Preserve same-origin Host including a nonstandard local port (CSRF regression).
proxy_set_header Host $http_host;
# Overwrite, never append visitor-controlled forwarding headers.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $viridexa_forwarded_scheme;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-Visitor "";
proxy_set_header X-Viridexa-Client-IP $remote_addr;
proxy_set_header X-Viridexa-Proto $viridexa_forwarded_scheme;
proxy_connect_timeout 3s;
proxy_send_timeout 10s;
proxy_read_timeout 40s;

# No proxy response cache or response compression for sessions/CSRF/private data.
proxy_cache off;
gzip off;
