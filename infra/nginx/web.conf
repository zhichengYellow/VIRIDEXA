# Direct local mode defaults. The deployment template exposes only explicit VIRIDEXA_NGINX_* knobs.
include /etc/nginx/trusted-proxies.conf;
map $viridexa_forwarded_scheme $viridexa_hsts { default ""; https "max-age=31536000"; }
limit_req_zone $binary_remote_addr zone=ordinary_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=search_graph:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=account_auth:10m rate=10r/m;
map $request_method $agent_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $agent_write_key zone=agent_requests:10m rate=2r/s;
map $request_method $admin_write_key { default ""; POST $binary_remote_addr; }
limit_req_zone $admin_write_key zone=admin_writes:10m rate=10r/m;
log_format safe_security '$time_iso8601 $request_method $uri $status limit=$limit_req_status rt=$request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log safe_security;
    client_max_body_size 32k;
    client_body_timeout 8s;
    client_header_timeout 8s;
    keepalive_timeout 20s;
    send_timeout 15s;
    limit_req_status 429;
    limit_req_log_level notice;
    error_page 429 = @rate_limited;
    include /etc/nginx/security-headers.conf;

    location @rate_limited {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Retry-After 10 always;
        add_header Cache-Control no-store always;
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试。"}';
    }
    location ~ ^/api/v1/(account/(login|register)|admin/session)$ {
        # Existing authentication protection stays enforced during observation of new zones.
        limit_req zone=account_auth burst=8 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location ~ ^/api/v1/agent/runs(/|$) {
        limit_req zone=ordinary_api burst=40 nodelay;
        limit_req zone=agent_requests burst=8 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location ~ ^/api/v1/admin/ {
        limit_req zone=ordinary_api burst=30 nodelay;
        limit_req zone=admin_writes burst=5 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location ~ ^/api/v1/(plants|graph|science|workbench)(/|$) {
        limit_req zone=search_graph burst=24 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location /api/ {
        limit_req zone=ordinary_api burst=40 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location ~ ^/(api-docs|docs|swagger-ui)(/|$) {
        limit_req zone=ordinary_api burst=10 nodelay;
        limit_req_dry_run off;
        include /etc/nginx/proxy-common.conf;
    }
    location /actuator/ { return 404; }
    location /media/ {
        alias /media-public/;
        autoindex off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
